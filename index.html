<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>불규칙동사 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0f1117; --card:#1a1d2e; --card2:#222538;
    --accent:#7c6ff7; --accent2:#ff7eb3;
    --green:#4ade80; --red:#f87171; --yellow:#fbbf24;
    --text:#e8e9f3; --muted:#8b8fa8; --border:#2e3150; --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Nunito','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 60px;}
  body::before{content:'';position:fixed;top:-200px;left:-200px;width:600px;height:600px;
    background:radial-gradient(circle,rgba(124,111,247,.15) 0%,transparent 70%);pointer-events:none;z-index:0;}
  body::after{content:'';position:fixed;bottom:-150px;right:-150px;width:500px;height:500px;
    background:radial-gradient(circle,rgba(255,126,179,.1) 0%,transparent 70%);pointer-events:none;z-index:0;}
  #app{width:100%;max-width:540px;position:relative;z-index:1;}

  /* HEADER */
  .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
  .logo{font-size:22px;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .progress-wrap{display:flex;align-items:center;gap:10px;}
  .progress-text{font-size:14px;color:var(--muted);font-weight:700;}
  .progress-bar-bg{width:100px;height:7px;background:var(--border);border-radius:99px;overflow:hidden;}
  .progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));
    border-radius:99px;transition:width .4s ease;width:0%;}

  /* CARD */
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:28px 24px;margin-bottom:16px;box-shadow:0 8px 32px rgba(0,0,0,.4);}

  /* VERB */
  .verb-label{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--accent);font-weight:800;margin-bottom:8px;}
  .verb-word{font-size:58px;font-weight:900;letter-spacing:-2px;line-height:1;margin-bottom:16px;
    background:linear-gradient(135deg,#fff 30%,var(--muted));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

  /* REVEAL GRID */
  .reveal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .reveal-btn{background:var(--card2);border:2px solid var(--border);border-radius:14px;padding:18px 14px;
    font-family:'Nunito','Noto Sans KR',sans-serif;font-size:15px;font-weight:700;color:var(--muted);
    cursor:pointer;text-align:center;transition:all .2s;min-height:80px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;-webkit-appearance:none;}
  .reveal-btn:active{transform:scale(.96);}
  .reveal-btn .btn-label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;opacity:.6;}
  .reveal-btn .btn-value{font-size:18px;font-weight:900;color:var(--text);}
  .reveal-btn.hint-btn{grid-column:span 2;background:rgba(124,111,247,.1);border-color:rgba(124,111,247,.4);
    color:var(--accent);min-height:60px;flex-direction:row;gap:10px;font-size:17px;}
  .reveal-btn.hint-btn:active{background:rgba(124,111,247,.2);}
  .reveal-btn.hint-btn.used{opacity:.5;}
  .reveal-btn.revealed{border-color:var(--accent);background:rgba(124,111,247,.08);}
  .reveal-btn.revealed .btn-label{opacity:.8;color:var(--accent);}

  /* EXAMPLE */
  .example-area{display:none;margin-top:20px;padding-top:20px;border-top:1px solid var(--border);}
  .example-area.visible{display:block;animation:fadeIn .3s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .ex-recommended-label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent);font-weight:800;margin-bottom:4px;}
  .ex-recommended{font-size:16px;font-weight:700;color:var(--text);margin-bottom:14px;white-space:pre-line;}
  .ex-label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--accent2);font-weight:800;margin-bottom:4px;}
  .ex-en{font-size:16px;font-style:italic;color:var(--text);line-height:1.6;margin-bottom:6px;}
  .ex-ko{font-size:14px;color:var(--muted);line-height:1.5;}

  /* JUDGE */
  .judge-area{display:none;margin-top:16px;}
  .judge-area.visible{display:flex;gap:12px;}
  .judge-btn{flex:1;padding:20px 10px;border:none;border-radius:14px;
    font-family:'Nunito','Noto Sans KR',sans-serif;font-size:18px;font-weight:900;
    cursor:pointer;transition:transform .1s,box-shadow .2s;-webkit-appearance:none;}
  .judge-btn:active{transform:scale(.96);}
  .judge-correct{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;box-shadow:0 4px 20px rgba(34,197,94,.3);}
  .judge-wrong{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;box-shadow:0 4px 20px rgba(239,68,68,.3);}

  /* NEXT */
  .next-area{display:none;margin-top:14px;}
  .next-area.visible{display:block;}
  .btn-next{width:100%;padding:18px;border:1.5px solid var(--border);border-radius:14px;
    background:linear-gradient(135deg,#2e3150,#3a3e62);
    font-family:'Nunito','Noto Sans KR',sans-serif;font-size:18px;font-weight:800;color:var(--text);
    cursor:pointer;transition:all .2s;-webkit-appearance:none;}
  .btn-next:active{transform:scale(.98);}

  /* START SCREEN */
  #start-screen .card{text-align:center;padding:44px 28px;}
  .start-emoji{font-size:64px;margin-bottom:16px;}
  .start-title{font-size:26px;font-weight:900;margin-bottom:10px;}
  .start-sub{font-size:15px;color:var(--muted);margin-bottom:28px;line-height:1.7;}
  .start-count{display:inline-block;background:rgba(124,111,247,.15);border:1px solid rgba(124,111,247,.3);
    border-radius:99px;padding:6px 18px;font-size:14px;font-weight:700;color:var(--accent);margin-bottom:28px;}
  .btn-start{width:100%;padding:20px;border:none;border-radius:14px;
    background:linear-gradient(135deg,var(--accent),#5b52d4);color:#fff;
    font-family:'Nunito','Noto Sans KR',sans-serif;font-size:19px;font-weight:900;
    cursor:pointer;box-shadow:0 4px 20px rgba(124,111,247,.35);-webkit-appearance:none;margin-bottom:14px;}
  .btn-start:active{transform:scale(.97);}
  .btn-study{width:100%;padding:20px;border:none;border-radius:14px;
    background:linear-gradient(135deg,#0ea5e9,#0369a1);color:#fff;
    font-family:'Nunito','Noto Sans KR',sans-serif;font-size:19px;font-weight:900;
    cursor:pointer;box-shadow:0 4px 20px rgba(14,165,233,.3);-webkit-appearance:none;}
  .btn-study:active{transform:scale(.97);}

  /* STUDY SCREEN */
  #study-screen{display:none;}
  .study-word-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:28px 24px;margin-bottom:16px;box-shadow:0 8px 32px rgba(0,0,0,.4);}
  .study-list{display:flex;flex-direction:column;gap:10px;margin-bottom:0;}
  .study-row{display:flex;align-items:center;gap:14px;padding:14px 18px;
    border-radius:12px;background:var(--card2);border:2px solid var(--border);
    transition:all .3s;}
  .study-row.active{border-color:var(--accent);background:rgba(124,111,247,.12);
    box-shadow:0 0 0 3px rgba(124,111,247,.2);}
  .study-row-icon{font-size:22px;min-width:28px;text-align:center;}
  .study-row-content{}
  .study-row-label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;
    color:var(--muted);font-weight:800;margin-bottom:3px;}
  .study-row-label.active-label{color:var(--accent);}
  .study-row-value{font-size:19px;font-weight:900;color:var(--text);}
  .study-row-value.meaning{font-size:17px;color:var(--text);}

  .study-progress{font-size:13px;color:var(--muted);text-align:center;margin-bottom:14px;font-weight:700;}
  .study-progress span{color:var(--accent);font-weight:900;}

  .study-btn-group{display:flex;flex-direction:column;gap:12px;}
  .btn-study-restart{width:100%;padding:18px;border:none;border-radius:14px;
    background:linear-gradient(135deg,#0ea5e9,#0369a1);color:#fff;
    font-family:'Nunito','Noto Sans KR',sans-serif;font-size:17px;font-weight:900;
    cursor:pointer;-webkit-appearance:none;}
  .btn-study-restart:active{transform:scale(.97);}
  .btn-to-home{width:100%;padding:18px;border:1.5px solid var(--border);border-radius:14px;
    background:transparent;color:var(--muted);
    font-family:'Nunito','Noto Sans KR',sans-serif;font-size:17px;font-weight:800;
    cursor:pointer;-webkit-appearance:none;}
  .btn-to-home:active{transform:scale(.97);}
  .btn-to-quiz-from-study{width:100%;padding:18px;border:none;border-radius:14px;
    background:linear-gradient(135deg,var(--accent),#5b52d4);color:#fff;
    font-family:'Nunito','Noto Sans KR',sans-serif;font-size:17px;font-weight:900;
    cursor:pointer;box-shadow:0 4px 20px rgba(124,111,247,.3);-webkit-appearance:none;}
  .btn-to-quiz-from-study:active{transform:scale(.97);}

  /* SCORE SCREEN */
  #score-screen{display:none;}
  .score-emoji{font-size:80px;text-align:center;margin-bottom:12px;animation:bounce .6s ease;}
  @keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-20px)}70%{transform:translateY(-8px)}}
  .score-big{text-align:center;font-size:72px;font-weight:900;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:8px;}
  .score-label{text-align:center;font-size:15px;color:var(--muted);margin-bottom:6px;}
  .score-comment{text-align:center;font-size:18px;font-weight:700;color:var(--text);margin-bottom:28px;line-height:1.5;}
  .score-detail{display:flex;justify-content:center;gap:28px;margin-bottom:28px;}
  .score-stat{text-align:center;}
  .score-stat-num{font-size:30px;font-weight:900;}
  .score-stat-num.c{color:var(--green);}
  .score-stat-num.w{color:var(--red);}
  .score-stat-num.h{color:var(--yellow);}
  .score-stat-lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
  .wrong-list{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:20px;}
  .wrong-list-title{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--red);font-weight:800;margin-bottom:12px;}
  .wrong-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px;}
  .wrong-item:last-child{border-bottom:none;}
  .wrong-verb{font-weight:900;color:var(--text);min-width:90px;font-size:16px;}
  .hint-badge{font-size:15px;color:var(--yellow);}
  .btn-group{display:flex;flex-direction:column;gap:12px;}
  .btn-score{width:100%;padding:20px;border:none;border-radius:14px;
    font-family:'Nunito','Noto Sans KR',sans-serif;font-size:18px;font-weight:900;
    cursor:pointer;-webkit-appearance:none;}
  .btn-score:active{transform:scale(.97);}
  .btn-score.primary{background:linear-gradient(135deg,var(--accent),#5b52d4);color:#fff;box-shadow:0 4px 20px rgba(124,111,247,.35);}
  .btn-score.danger{background:linear-gradient(135deg,var(--accent2),#d4538f);color:#fff;box-shadow:0 4px 20px rgba(255,126,179,.3);}
  .btn-score.study-wrong{background:linear-gradient(135deg,#0ea5e9,#0369a1);color:#fff;box-shadow:0 4px 20px rgba(14,165,233,.3);}
  .btn-score.outline{background:transparent;border:1.5px solid var(--border);color:var(--muted);}

  .hidden{display:none!important;}
  .speaking-dot{display:inline-block;width:8px;height:8px;border-radius:50%;
    background:var(--accent);margin-left:8px;animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
</style>
</head>
<body>
<div id="app">

<!-- ══ START ══ -->
<div id="start-screen">
  <div class="card">
    <div class="start-emoji">📚</div>
    <div class="start-title">불규칙동사</div>
    <div class="start-sub">동사 원형을 보고<br>과거형 · 과거분사형 · 뜻을 확인하세요</div>
    <div class="start-count">총 43개 동사</div>
    <button class="btn-start" id="btn-start">🎯 시작하기 (퀴즈)</button>
    <button class="btn-study" id="btn-study-all">🔊 학습하기 (전체 듣기)</button>
  </div>
</div>

<!-- ══ STUDY ══ -->
<div id="study-screen">
  <div class="header">
    <div class="logo">STUDY MODE</div>
    <div class="progress-text" id="study-progress-text"></div>
  </div>
  <div class="study-word-card">
    <div class="study-progress">
      <span id="study-cur">1</span> / <span id="study-total">43</span>
    </div>
    <div class="study-list" id="study-list">
      <div class="study-row" id="srow-verb">
        <div class="study-row-icon">🔤</div>
        <div class="study-row-content">
          <div class="study-row-label" id="slabel-verb">동사 원형</div>
          <div class="study-row-value" id="sval-verb">—</div>
        </div>
      </div>
      <div class="study-row" id="srow-past">
        <div class="study-row-icon">⏮</div>
        <div class="study-row-content">
          <div class="study-row-label" id="slabel-past">과거형</div>
          <div class="study-row-value" id="sval-past">—</div>
        </div>
      </div>
      <div class="study-row" id="srow-pp">
        <div class="study-row-icon">📌</div>
        <div class="study-row-content">
          <div class="study-row-label" id="slabel-pp">과거분사형</div>
          <div class="study-row-value" id="sval-pp">—</div>
        </div>
      </div>
      <div class="study-row" id="srow-meaning">
        <div class="study-row-icon">💬</div>
        <div class="study-row-content">
          <div class="study-row-label" id="slabel-meaning">뜻</div>
          <div class="study-row-value meaning" id="sval-meaning">—</div>
        </div>
      </div>
    </div>
  </div>
  <div class="study-btn-group" id="study-btn-group">
    <button class="btn-study-restart" id="btn-study-restart">🔄 처음부터 다시 듣기</button>
    <button class="btn-to-quiz-from-study hidden" id="btn-study-to-quiz">🎯 다시 풀기</button>
    <button class="btn-to-quiz-from-study hidden" id="btn-study-stop">⏹ 종료하기</button>
    <button class="btn-to-home" id="btn-study-home">← 시작 메뉴</button>
  </div>
</div>

<!-- ══ QUIZ ══ -->
<div id="quiz-screen" class="hidden">
  <div class="header">
    <div class="logo">VERB QUIZ</div>
    <div class="progress-wrap">
      <div class="progress-text" id="progress-text">0 / 43</div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-bar"></div></div>
    </div>
  </div>
  <div class="card">
    <div class="verb-label">동사 원형</div>
    <div class="verb-word" id="verb-display">—</div>
    <div class="reveal-grid">
      <button class="reveal-btn hint-btn" id="btn-hint">
        <span style="font-size:22px">🔊</span>
        <span>힌트 (과거형·과거분사형 발음 듣기)</span>
      </button>
      <button class="reveal-btn" id="btn-past">
        <span class="btn-label">과거형</span>
        <span class="btn-value" id="val-past">탭하여 확인</span>
      </button>
      <button class="reveal-btn" id="btn-pp">
        <span class="btn-label">과거분사형</span>
        <span class="btn-value" id="val-pp">탭하여 확인</span>
      </button>
      <button class="reveal-btn" id="btn-meaning">
        <span class="btn-label">뜻</span>
        <span class="btn-value" id="val-meaning">탭하여 확인</span>
      </button>
    </div>
    <div class="example-area" id="example-area">
      <div class="ex-recommended-label">추천 뜻</div>
      <div class="ex-recommended" id="ex-recommended"></div>
      <div class="ex-label">예문</div>
      <div class="ex-en" id="ex-en"></div>
      <div class="ex-ko" id="ex-ko"></div>
    </div>
  </div>
  <div class="judge-area" id="judge-area">
    <button class="judge-btn judge-correct" id="btn-correct">✅ 맞았음</button>
    <button class="judge-btn judge-wrong"   id="btn-wrong">❌ 틀렸음</button>
  </div>
  <div class="next-area" id="next-area">
    <button class="btn-next" id="btn-next">다음 →</button>
  </div>
</div>

<!-- ══ SCORE ══ -->
<div id="score-screen">
  <div class="card">
    <div class="score-emoji" id="score-emoji"></div>
    <div class="score-big"   id="score-num"></div>
    <div class="score-label">/ 100점</div>
    <div class="score-comment" id="score-comment"></div>
    <div class="score-detail">
      <div class="score-stat"><div class="score-stat-num c" id="stat-correct"></div><div class="score-stat-lbl">정답</div></div>
      <div class="score-stat"><div class="score-stat-num w" id="stat-wrong"></div><div class="score-stat-lbl">오답</div></div>
      <div class="score-stat"><div class="score-stat-num h" id="stat-hint"></div><div class="score-stat-lbl">힌트</div></div>
    </div>
  </div>
  <div class="wrong-list hidden" id="wrong-list">
    <div class="wrong-list-title">❌ 틀린 단어</div>
    <div id="wrong-items"></div>
  </div>
  <div class="btn-group">
    <button class="btn-score primary"      id="btn-retry-all">🔄 전체 다시 풀기</button>
    <button class="btn-score danger hidden" id="btn-retry-wrong">❌ 틀린 것만 다시 풀기</button>
    <button class="btn-score study-wrong hidden" id="btn-study-wrong">🔊 틀린 것만 학습하기</button>
    <button class="btn-score outline"      id="btn-score-home">← 시작 메뉴</button>
  </div>
</div>

</div><!-- #app -->
<script>
const WORDS = [
  {verb:"beat",   past:"beat",    pp:"beaten",   meaning:"이기다",   recommended:"이기다 / (북 등을) 치다",    exEn:"Our team beat the other team 3 to 1.",          exKo:"우리 팀이 상대 팀을 3대 1로 이겼다."},
  {verb:"bite",   past:"bit",     pp:"bitten",   meaning:"물다",     recommended:"물다",                        exEn:"The dog bit the boy's hand.",                   exKo:"개가 소년의 손을 물었다."},
  {verb:"blow",   past:"blew",    pp:"blown",    meaning:"불다",     recommended:"불다",                        exEn:"The wind blew all the leaves away.",             exKo:"바람이 나뭇잎을 모두 날려버렸다."},
  {verb:"break",  past:"broke",   pp:"broken",   meaning:"부수다",   recommended:"부수다 / 깨다",               exEn:"He broke the window by mistake.",               exKo:"그는 실수로 창문을 깼다."},
  {verb:"bring",  past:"brought", pp:"brought",  meaning:"가져오다", recommended:"가져오다",                    exEn:"She brought some cookies for everyone.",         exKo:"그녀는 모두를 위해 쿠키를 가져왔다."},
  {verb:"build",  past:"built",   pp:"built",    meaning:"건설하다", recommended:"짓다 / 건설하다",             exEn:"They built a new school in our town.",           exKo:"그들은 우리 마을에 새 학교를 지었다."},
  {verb:"buy",    past:"bought",  pp:"bought",   meaning:"사다",     recommended:"사다",                        exEn:"I bought a new bag at the market.",              exKo:"나는 시장에서 새 가방을 샀다."},
  {verb:"catch",  past:"caught",  pp:"caught",   meaning:"잡다",     recommended:"잡다 / (버스·기차를) 타다",   exEn:"He caught the ball with one hand.",              exKo:"그는 한 손으로 공을 잡았다."},
  {verb:"choose", past:"chose",   pp:"chosen",   meaning:"선택하다", recommended:"선택하다 / 고르다",           exEn:"She chose the red dress for the party.",         exKo:"그녀는 파티를 위해 빨간 드레스를 골랐다."},
  {verb:"draw",   past:"drew",    pp:"drawn",    meaning:"그리다",   recommended:"그리다",                      exEn:"He drew a map of the neighborhood.",             exKo:"그는 동네 지도를 그렸다."},

// ── TTS ──
function speak(text, onEnd) {
  try {
    if (!window.speechSynthesis) { onEnd && onEnd(); return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.9;
    u.onerror = () => { onEnd && onEnd(); };
    if (onEnd) u.onend = onEnd;
    window.speechSynthesis.speak(u);
  } catch(e) { onEnd && onEnd(); }
}
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── STUDY MODE ──
let studyQueue = [], studyIdx = 0, studyActive = false, studyWordsForQuiz = null;

function setActive(rowId, labelId) {
  ['srow-verb','srow-past','srow-pp','srow-meaning'].forEach(id => {
    document.getElementById(id).classList.remove('active');
  });
  ['slabel-verb','slabel-past','slabel-pp','slabel-meaning'].forEach(id => {
    const el = document.getElementById(id);
    el.classList.remove('active-label');
    // remove dot if any
    const dot = el.querySelector('.speaking-dot');
    if (dot) dot.remove();
  });
  if (rowId) {
    document.getElementById(rowId).classList.add('active');
    const lbl = document.getElementById(labelId);
    lbl.classList.add('active-label');
    const dot = document.createElement('span');
    dot.className = 'speaking-dot';
    lbl.appendChild(dot);
  }
}

async function studyPlayWord(w) {
  if (!studyActive) return;
  // show all data
  document.getElementById('sval-verb').textContent    = w.verb;
  document.getElementById('sval-past').textContent    = w.past;
  document.getElementById('sval-pp').textContent      = w.pp;
  document.getElementById('sval-meaning').textContent = w.meaning;

  // verb
  setActive('srow-verb','slabel-verb');
  await new Promise(r => speak(w.verb, r));
  if (!studyActive) return;
  await delay(1000);

  // past
  setActive('srow-past','slabel-past');
  await new Promise(r => speak(w.past, r));
  if (!studyActive) return;
  await delay(1000);

  // pp
  setActive('srow-pp','slabel-pp');
  await new Promise(r => speak(w.pp, r));
  if (!studyActive) return;
  await delay(1000);

  // meaning (no TTS - Korean)
  setActive('srow-meaning','slabel-meaning');
  await delay(1200);
  if (!studyActive) return;

  setActive(null, null);
  await delay(2000);
}

async function runStudy(words, wordsForQuiz) {
  studyQueue = words;
  studyWordsForQuiz = wordsForQuiz || null;
  studyIdx = 0;
  studyActive = true;

  // show screen
  startScreen.style.display = 'none';
  quizScreen.classList.add('hidden');
  scoreScreen.style.display = 'none';
  studyScreen.style.display = 'block';

  document.getElementById('study-total').textContent = words.length;
  document.getElementById('btn-study-to-quiz').classList.add('hidden');
  // 종료하기: 틀린것 학습일 때만 표시
  if (wordsForQuiz) {
    document.getElementById('btn-study-stop').classList.remove('hidden');
  } else {
    document.getElementById('btn-study-stop').classList.add('hidden');
  }

  for (let i = 0; i < words.length; i++) {
    if (!studyActive) break;
    studyIdx = i;
    document.getElementById('study-cur').textContent = i + 1;
    await studyPlayWord(words[i]);
  }

  if (studyActive) {
    // finished
    setActive(null, null);
    // show quiz button if we have words to quiz
    if (studyWordsForQuiz) {
      document.getElementById('btn-study-to-quiz').classList.remove('hidden');
    }
  }
}

function stopStudy() {
  studyActive = false;
  try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch(e){}
  setActive(null, null);
}

// ── QUIZ STATE ──
let quizWords = WORDS; // default
let queue = [], current = null, currentIdx = 0;
let correctCount = 0, wrongItems = [], hintCount = 0;
let hintUsed = false, revealedCount = 0;

function shuffle(arr) {
  const a = [...arr];
  for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

// ── DOM ──
const startScreen  = document.getElementById('start-screen');
const studyScreen  = document.getElementById('study-screen');
const quizScreen   = document.getElementById('quiz-screen');
const scoreScreen  = document.getElementById('score-screen');

function showStart() {
  stopStudy();
  startScreen.style.display = 'block';
  studyScreen.style.display = 'none';
  quizScreen.classList.add('hidden');
  scoreScreen.style.display = 'none';
}

// start buttons
document.getElementById('btn-start').addEventListener('click', () => {
  quizWords = WORDS;
  startQuiz(WORDS);
});
document.getElementById('btn-study-all').addEventListener('click', () => {
  runStudy(WORDS, null);
});

// study controls
document.getElementById('btn-study-restart').addEventListener('click', () => {
  stopStudy();
  setTimeout(() => runStudy(studyQueue, studyWordsForQuiz), 100);
});
document.getElementById('btn-study-stop').addEventListener('click', () => {
  stopStudy();
  if (studyWordsForQuiz) {
    // 틀린 것만 학습하기에서 온 경우 → 결과 화면으로
    studyScreen.style.display = 'none';
    scoreScreen.style.display = 'block';
  } else {
    showStart();
  }
});

document.getElementById('btn-study-home').addEventListener('click', showStart);
document.getElementById('btn-study-to-quiz').addEventListener('click', () => {
  stopStudy();
  startQuiz(studyWordsForQuiz);
});

// ── QUIZ ──
function startQuiz(words) {
  quizWords = words;
  queue = shuffle(words);
  currentIdx = 0; correctCount = 0; wrongItems = []; hintCount = 0;
  startScreen.style.display = 'none';
  studyScreen.style.display = 'none';
  scoreScreen.style.display = 'none';
  quizScreen.classList.remove('hidden');
  loadQuestion();
}

function loadQuestion() {
  if (currentIdx >= queue.length) { showScore(); return; }
  current = queue[currentIdx];
  hintUsed = false; revealedCount = 0;

  document.getElementById('verb-display').textContent = current.verb;
  updateProgress();

  ['btn-past','btn-pp','btn-meaning'].forEach(id => document.getElementById(id).classList.remove('revealed'));
  document.getElementById('val-past').textContent    = '탭하여 확인';
  document.getElementById('val-pp').textContent      = '탭하여 확인';
  document.getElementById('val-meaning').textContent = '탭하여 확인';
  document.getElementById('btn-hint').classList.remove('used');

  document.getElementById('example-area').classList.remove('visible');
  document.getElementById('judge-area').classList.remove('visible');
  document.getElementById('next-area').classList.remove('visible');
  ['btn-hint','btn-past','btn-pp','btn-meaning'].forEach(id => document.getElementById(id).disabled = false);

  speak(current.verb);
}

function updateProgress() {
  document.getElementById('progress-text').textContent = `${currentIdx} / ${queue.length}`;
  document.getElementById('progress-bar').style.width = queue.length > 0 ? `${(currentIdx/queue.length)*100}%` : '0%';
}

function checkAllRevealed() {
  if (revealedCount === 3) {
    document.getElementById('ex-recommended').textContent = current.recommended;
    document.getElementById('ex-en').textContent = current.exEn;
    document.getElementById('ex-ko').textContent = current.exKo;
    document.getElementById('example-area').classList.add('visible');
    document.getElementById('judge-area').classList.add('visible');
    ['btn-hint','btn-past','btn-pp','btn-meaning'].forEach(id => document.getElementById(id).disabled = true);
  }
}

document.getElementById('btn-hint').addEventListener('click', () => {
  if (document.getElementById('btn-hint').disabled) return;
  if (!hintUsed) { hintUsed = true; hintCount++; }
  document.getElementById('btn-hint').classList.add('used');
  speak(current.past, () => { setTimeout(() => speak(current.pp), 2000); });
});

document.getElementById('btn-past').addEventListener('click', () => {
  const btn = document.getElementById('btn-past');
  if (btn.disabled || btn.classList.contains('revealed')) return;
  document.getElementById('val-past').textContent = current.past;
  btn.classList.add('revealed'); revealedCount++;
  speak(current.past);
  checkAllRevealed();
});

document.getElementById('btn-pp').addEventListener('click', () => {
  const btn = document.getElementById('btn-pp');
  if (btn.disabled || btn.classList.contains('revealed')) return;
  document.getElementById('val-pp').textContent = current.pp;
  btn.classList.add('revealed'); revealedCount++;
  speak(current.pp);
  checkAllRevealed();
});

document.getElementById('btn-meaning').addEventListener('click', () => {
  const btn = document.getElementById('btn-meaning');
  if (btn.disabled || btn.classList.contains('revealed')) return;
  document.getElementById('val-meaning').textContent = current.meaning;
  btn.classList.add('revealed'); revealedCount++;
  checkAllRevealed();
});

document.getElementById('btn-correct').addEventListener('click', () => {
  correctCount++; currentIdx++;
  loadQuestion();
});

document.getElementById('btn-wrong').addEventListener('click', () => {
  wrongItems.push({ verb: current.verb, hintUsed });
  currentIdx++;
  loadQuestion();
});

// ── SCORE ──
function showScore() {
  quizScreen.classList.add('hidden');
  scoreScreen.style.display = 'block';

  const total = queue.length;
  const pct = Math.round((correctCount / total) * 100);
  document.getElementById('score-num').textContent = pct;
  document.getElementById('stat-correct').textContent = correctCount;
  document.getElementById('stat-wrong').textContent = total - correctCount;
  document.getElementById('stat-hint').textContent = hintCount;

  let emoji, comment;
  if      (pct===100) { emoji='🏆'; comment='완벽해! 진짜 천재인 것 같은데?! 🎉'; }
  else if (pct>= 90)  { emoji='🤩'; comment='거의 다 맞았어! 조금만 더 하면 완벽!'; }
  else if (pct>= 80)  { emoji='😎'; comment='잘했어! 틀린 것만 조금 더 연습해봐~'; }
  else if (pct>= 70)  { emoji='🙂'; comment='꽤 잘했는데? 한 번 더 도전해보자!'; }
  else if (pct>= 60)  { emoji='😅'; comment='절반 이상은 맞혔어! 조금 더 힘내자 💪'; }
  else if (pct>= 40)  { emoji='😬'; comment='아직 많이 남았어. 틀린 것 위주로 다시 해봐!'; }
  else                { emoji='😭'; comment='오늘은 좀 힘들었나봐... 다시 한번만 해보자! 넌 할 수 있어!!'; }

  document.getElementById('score-emoji').textContent = emoji;
  document.getElementById('score-comment').textContent = comment;

  const wrongList = document.getElementById('wrong-list');
  const wrongItemsEl = document.getElementById('wrong-items');
  const retryWrongBtn = document.getElementById('btn-retry-wrong');
  const studyWrongBtn = document.getElementById('btn-study-wrong');

  if (wrongItems.length > 0) {
    wrongList.classList.remove('hidden');
    wrongItemsEl.innerHTML = wrongItems.map(wi =>
      `<div class="wrong-item">
        <span class="wrong-verb">${wi.verb}</span>
        ${wi.hintUsed ? '<span class="hint-badge">🔔 힌트 사용</span>' : ''}
      </div>`).join('');
    retryWrongBtn.classList.remove('hidden');
    studyWrongBtn.classList.remove('hidden');
  } else {
    wrongList.classList.add('hidden');
    retryWrongBtn.classList.add('hidden');
    studyWrongBtn.classList.add('hidden');
  }
}

document.getElementById('btn-retry-all').addEventListener('click', () => startQuiz(WORDS));
document.getElementById('btn-retry-wrong').addEventListener('click', () => {
  const verbsToRetry = [...new Set(wrongItems.map(w => w.verb))];
  startQuiz(WORDS.filter(w => verbsToRetry.includes(w.verb)));
});
document.getElementById('btn-study-wrong').addEventListener('click', () => {
  const verbsToRetry = [...new Set(wrongItems.map(w => w.verb))];
  const wordsToStudy = WORDS.filter(w => verbsToRetry.includes(w.verb));
  runStudy(wordsToStudy, wordsToStudy);
});
document.getElementById('btn-score-home').addEventListener('click', showStart);
</script>
